[package]
name = "stactics"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Rust SDK for Stactics ingest events"
repository = "https://github.com/nexuindustries/stactics-sdks"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
